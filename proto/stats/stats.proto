// ============================================================
// Card Stats Services
// ============================================================

service CardStatsBalanceService {
  rpc FindMonthlyBalance(FindYearAmount) returns (ApiResponseMonthlyBalance) {}
  rpc FindYearlyBalance(FindYearAmount) returns (ApiResponseYearlyBalance) {}

  rpc FindMonthlyBalanceByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseMonthlyBalance) {}
  rpc FindYearlyBalanceByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseYearlyBalance) {}
}

service CardStatsTopupService {
  rpc FindMonthlyTopupAmount(FindYearAmount)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTopupAmount(FindYearAmount) returns (ApiResponseYearlyAmount) {}

  rpc FindMonthlyTopupAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTopupAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseYearlyAmount) {}
}

service CardStatsTransactionService {
  rpc FindMonthlyTransactionAmount(FindYearAmount)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransactionAmount(FindYearAmount)
      returns (ApiResponseYearlyAmount) {}

  rpc FindMonthlyTransactionAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransactionAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseYearlyAmount) {}
}

service CardStatsTransferService {
  rpc FindMonthlyTransferSenderAmount(FindYearAmount)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransferSenderAmount(FindYearAmount)
      returns (ApiResponseYearlyAmount) {}

  rpc FindMonthlyTransferReceiverAmount(FindYearAmount)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransferReceiverAmount(FindYearAmount)
      returns (ApiResponseYearlyAmount) {}

  rpc FindMonthlyTransferSenderAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransferSenderAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseYearlyAmount) {}

  rpc FindMonthlyTransferReceiverAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyTransferReceiverAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseYearlyAmount) {}
}

service CardStatsWithdrawService {
  rpc FindMonthlyWithdrawAmount(FindYearAmount)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyWithdrawAmount(FindYearAmount)
      returns (ApiResponseYearlyAmount) {}

  rpc FindMonthlyWithdrawAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseMonthlyAmount) {}
  rpc FindYearlyWithdrawAmountByCardNumber(FindYearAmountCardNumber)
      returns (ApiResponseYearlyAmount) {}
}


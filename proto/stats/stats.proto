syntax = "proto3";

package pb.stats;

option go_package = "github.com/MamangRust/microservice-payment-gateway-grpc/pb/stats";

// ============================================================
// Request messages (self-contained, no imports)
// ============================================================

// Card stats requests
message FindYearAmount { int32 year = 1; }

message FindYearAmountCardNumber {
  int32 year = 1;
  string card_number = 2;
}

message FindYearBalance { int32 year = 1; }

message FindYearBalanceCardNumber {
  int32 year = 1;
  string card_number = 2;
}

// Merchant stats requests
message FindYearMerchant { int32 year = 1; }

message FindYearMerchantById {
  int32 year = 1;
  int32 merchant_id = 2;
}

message FindYearMerchantByApikey {
  int32 year = 1;
  string api_key = 2;
}

// Saldo stats requests
message FindMonthlySaldoTotalBalance {
  int32 year = 1;
  int32 month = 2;
}

message FindYearlySaldo { int32 year = 1; }

// Topup stats requests
message FindMonthlyTopupStatus {
  int32 year = 1;
  int32 month = 2;
}

message FindYearTopupStatus { int32 year = 1; }

message FindMonthlyTopupStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
  int32 month = 3;
}

message FindYearTopupStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
}

message FindYearTopupCardNumber {
  string card_number = 1;
  int32 year = 2;
}

// Transaction stats requests
message FindYearTransactionStatus { int32 year = 1; }

message FindMonthlyTransactionStatus {
  int32 year = 1;
  int32 month = 2;
}

message FindByYearCardNumberTransactionRequest {
  string card_number = 1;
  int32 year = 2;
}

message FindYearTransactionStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
}

message FindMonthlyTransactionStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
  int32 month = 3;
}

// Transfer stats requests
message FindYearTransferStatus { int32 year = 1; }

message FindMonthlyTransferStatus {
  int32 year = 1;
  int32 month = 2;
}

message FindYearTransferStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
}

message FindMonthlyTransferStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
  int32 month = 3;
}

message FindByCardNumberTransferRequest {
  string card_number = 1;
  int32 year = 2;
}

// Withdraw stats requests
message FindYearWithdrawStatus { int32 year = 1; }

message FindMonthlyWithdrawStatus {
  int32 year = 1;
  int32 month = 2;
}

message FindYearWithdrawStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
}

message FindMonthlyWithdrawStatusCardNumber {
  string card_number = 1;
  int32 year = 2;
  int32 month = 3;
}

message FindYearWithdrawCardNumber {
  string card_number = 1;
  int32 year = 2;
}

// ============================================================
// Card Stats Response Messages
// ============================================================

message CardResponseMonthlyBalance {
  string month = 1;
  int64 total_balance = 2;
}

message CardResponseYearlyBalance {
  string year = 1;
  int64 total_balance = 2;
}

message ApiResponseMonthlyBalance {
  string status = 1;
  string message = 2;
  repeated CardResponseMonthlyBalance data = 3;
}

message ApiResponseYearlyBalance {
  string status = 1;
  string message = 2;
  repeated CardResponseYearlyBalance data = 3;
}

message CardResponseMonthlyAmount {
  string month = 1;
  int64 total_amount = 2;
}

message CardResponseYearlyAmount {
  string year = 1;
